<h1 class="text-center text-success py-5">COUNTER STATE MANAGEMENT</h1>

<h2 class="text-center">
  Count : {{ count$ | async }}
</h2>

<div class="text-center container mt-5">
  <button class="btn btn-primary me-4" (click)="increment()">Increment</button>
  <button class="btn btn-secondary me-4" (click)="decrement()">Decrement</button>
  <button class="btn btn-warning" (click)="reset()">Reset</button>
</div>
