<form #formRef="ngForm" (ngSubmit)="submitted(formRef)">

    Username : 
    <input type="text" name="username" ngModel #uname="ngModel">

    <br/>
    <br/>

    Password :
    <input type="password" name="password" ngModel #pass="ngModel">

    <br/>
    <br/>

    <button type="submit">Submit</button>

</form>
